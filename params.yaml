data_extraction:
  tickers:
    - AAPL
    - MSFT
    - TSLA
    - NVDA
    - GOOGL
    - SH

  start_date: "2023-01-01"

  end_date: null

  interval: "1d"
  auto_adjust: true


data_transformation:
  rolling_window_7: 7
  rolling_window_30: 30

  calculate_daily_return: true
  calculate_volatility: true
  calculate_rsi: true

  missing_value_strategy: "drop"

database:
  table_name: "stock_prices"
  if_exists: "append"

dashboard:
  default_ticker: "AAPL"
  chart_height: 600

logging:
  log_level: "INFO"


model_training:
  sequence_length: 30
  epochs: 50
  batch_size: 32
  validation_split: 0.2
  forecast_days: 7
  target_column: "Close"